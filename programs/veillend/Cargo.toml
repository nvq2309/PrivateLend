[package]
name = "veillend"
version = "0.1.0"
description = "VeilLend - Privacy-preserving lending protocol with liquidation protection"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "veillend"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
custom-heap = []
custom-panic = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
kamino-lend = "0.4.1"
solana-sha256-hasher = "2.3.0"

[profile.release]
overflow-checks = false
opt-level = "z"
codegen-units = 1
